---
applications:
  - name: weather-agent
    docker:
      image: ghcr.io/boidra-labs/weather-agent:0.1.0
      # username: <github-username>          # set CF_DOCKER_PASSWORD env var with the GHCR PAT
    memory: 512M
    disk_quota: 1G
    instances: 1
    health-check-type: http
    health-check-http-endpoint: /.well-known/agent-card.json
    timeout: 60
    env:
      LOG_LEVEL: INFO
      AICORE_MODEL: gpt-4.1
      DEFAULT_LOCATION: Wroclaw, Poland
      AGENT_PUBLIC_URL: https://weather-agent.cfapps.eu10-005.hana.ondemand.com/
      # --- OpenTelemetry (set OTEL_EXPORTER_OTLP_HEADERS via cf set-env — never in this file)
      OTEL_SERVICE_NAME: ag-test-weather
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev,service.namespace=ws-private-m-kwasniewski-boidra-com
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: https://boidra-api.cfapps.eu10-005.hana.ondemand.com/otel
    services:
      - weather-agent-aicore             # SAP AI Core (required — LLM)
      - weather-agent-xsuaa              # XSUAA (required — JWT auth)
      # - weather-agent-destination      # BTP Destination (not needed — Open-Meteo is called directly)
      # - weather-agent-agent-memory     # SAP Agent Memory (optional — multi-turn memory)
      # - weather-agent-cloud-logging    # SAP Cloud Logging (optional — alternative OTel backend)
    routes:
      - route: weather-agent.cfapps.eu10-005.hana.ondemand.com
