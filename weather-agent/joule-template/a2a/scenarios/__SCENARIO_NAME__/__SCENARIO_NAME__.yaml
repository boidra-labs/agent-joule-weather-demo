description: "${JOULE_SCENARIO_DESCRIPTION}"

target:
  type: function
  name: ${JOULE_AGENT_NAME}
  parameters:
    - name: agent_context_id
      value: $capability_context.agent_context_id

response_context:
  - description: "${JOULE_RESPONSE_DESCRIPTION}"
    value: $target_result.agent_result

capability_context:
  - name: agent_context_id
    value: $target_result.agent_context_id
