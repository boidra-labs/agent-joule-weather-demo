parameters:
  - name: agent_context_id
    optional: true

action_groups:
  - actions:
      - type: agent-request
        agent_type: remote
        system_alias: WEATHER_AGENT
        result_variable: _agent_response

  - actions:
      - type: set-variables
        scripting_type: spel
        variables:
          - name: _context_id
            value: "<? _agent_response.body.contextId ?>"
          - name: _task_id
            value: "<? _agent_response.body.id ?>"
          - name: _state
            value: "<? _agent_response.body.status.state ?>"
          - name: _markdown
            value: "<? _agent_response.body.artifacts[0].parts[0].text ?>"

  - actions:
      - type: message
        message:
          type: text
          content: "<? _markdown ?>"
          markdown: true

result:
  agent_context_id: <? _context_id ?>
  agent_task_id: <? _task_id ?>
  agent_state: <? _state ?>
