description: "Get the weather forecast for the next 5 days for a city, for example Wroclaw, Poland."

target:
  type: function
  name: weather_agent
  parameters:
    - name: agent_context_id
      value: $capability_context.agent_context_id

capability_context:
  - name: agent_context_id
    value: $target_result.agent_context_id
